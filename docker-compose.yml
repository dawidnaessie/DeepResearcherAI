services:
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: deepresearcher-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MODEL_NAME=${MODEL_NAME:-gemini-3.6-flash}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - deepresearcher-net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: deepresearcher-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - deepresearcher-net

networks:
  deepresearcher-net:
    driver: bridge

volumes:
  backend-logs:
    driver: local
